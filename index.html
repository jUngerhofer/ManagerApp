<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer App">
<meta name="theme-color" content="#16a07a">
<title>Trainer App</title>
<style>
:root{
  --green:#16a07a;--green-dark:#0d7a5c;--green-light:#e6f7f2;
  --orange:#f59e0b;--orange-light:#fef3c7;
  --red:#ef4444;--red-light:#fee2e2;
  --blue:#3b82f6;--blue-light:#eff6ff;
  --gray:#6b7280;--gray-light:#f3f4f6;--gray-border:#e5e7eb;
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --bg:#f9fafb;--card:#ffffff;
  --radius:14px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:block}

/* ── TOP NAV ── */
.topnav{background:var(--card);border-bottom:1px solid var(--gray-border);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.topnav-back{background:none;border:none;color:var(--green);font-size:15px;font-weight:500;display:flex;align-items:center;gap:4px}
.topnav h1{font-size:17px;font-weight:600;flex:1}
.topnav .subtitle{font-size:13px;color:var(--text2);margin-top:1px}

/* ── TAB BAR ── */
.tabbar{background:var(--card);border-top:1px solid var(--gray-border);display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar-btn{flex:1;background:none;border:none;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--text3);transition:color .15s}
.tabbar-btn.active{color:var(--green)}
.tabbar-btn svg{width:22px;height:22px;stroke-width:1.8}

/* ── CONTENT WRAP ── */
.content{padding:16px;padding-bottom:80px;max-width:640px;margin:0 auto}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:12px}

/* ── BUTTONS ── */
.btn{border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);padding:9px 16px;font-size:14px;font-weight:500;background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:active{opacity:.75;transform:scale(.97)}
.btn-primary{background:var(--green);border-color:var(--green-dark);color:#fff}
.btn-primary:active{background:var(--green-dark)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:var(--radius-sm)}
.btn-danger{border-color:#fca5a5;color:var(--red)}
.btn-block{width:100%;justify-content:center;padding:12px}
.btn-ghost{border:none;background:none;color:var(--green);font-weight:500}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:var(--green-light);color:var(--green-dark)}
.badge-orange{background:var(--orange-light);color:#92400e}
.badge-red{background:var(--red-light);color:#991b1b}
.badge-blue{background:var(--blue-light);color:#1e40af}
.badge-gray{background:var(--gray-light);color:var(--gray)}

/* ── PROGRESS BAR ── */
.bar-wrap{background:var(--gray-light);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}

/* ── FORM ── */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:11px 13px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);font-size:15px;background:var(--card);color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.pos-group{display:flex;gap:8px;flex-wrap:wrap}
.pos-pill{padding:7px 14px;border:1.5px solid var(--gray-border);border-radius:20px;font-size:13px;font-weight:500;background:var(--card);color:var(--text)}
.pos-pill.on{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:540px){.overlay{align-items:center}}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 20px 36px;max-height:88vh;overflow-y:auto}
@media(min-width:540px){.modal{border-radius:var(--radius);padding-bottom:20px}}
.modal-drag{width:36px;height:4px;background:var(--gray-border);border-radius:2px;margin:0 auto 18px}
.modal h2{font-size:18px;font-weight:600;margin-bottom:18px}
.modal-row{display:flex;gap:10px;margin-top:16px}
.modal-row .btn{flex:1;justify-content:center;padding:12px}

/* ── HOME SCREEN ── */
.team-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.team-item{display:flex;align-items:center;gap:14px;padding:16px;cursor:pointer}
.team-item:active{opacity:.7}
.team-icon{width:46px;height:46px;border-radius:12px;background:var(--green-light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.team-name{font-size:16px;font-weight:600}
.team-meta{font-size:13px;color:var(--text2);margin-top:2px}
.team-arrow{margin-left:auto;color:var(--text3);font-size:20px}

/* ── PLAYER CARDS ── */
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;margin-top:14px}
.pcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;border-left:4px solid var(--gray-border)}
.pcard:active{transform:scale(.97)}
.pcard.green{border-left-color:var(--green)}
.pcard.orange{border-left-color:var(--orange)}
.pcard.red{border-left-color:var(--red)}
.pcard-name{font-size:15px;font-weight:600;margin-bottom:2px}
.pcard-pos{font-size:12px;color:var(--text2);margin-bottom:10px}
.pcard-pts{display:flex;align-items:baseline;gap:5px}
.pcard-pts .big{font-size:24px;font-weight:700}
.pcard-pts .mx{font-size:13px;color:var(--text2)}

/* ── RANKING ── */
.rank-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rank-item{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.rank-num{font-size:20px;font-weight:700;min-width:30px;color:var(--text2)}
.rank-num.top{color:var(--green)}
.rank-avatar{width:40px;height:40px;border-radius:50%;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.rank-name{font-size:15px;font-weight:600}
.rank-pos{font-size:12px;color:var(--text2);margin-top:1px}
.rank-right{margin-left:auto;text-align:right}
.rank-pts{font-size:18px;font-weight:700}
.rank-pct{font-size:12px;color:var(--text2)}

/* ── DETAIL ── */
.detail-hero{background:var(--card);padding:20px;display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--gray-border)}
.detail-avatar{width:56px;height:56px;border-radius:50%;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;flex-shrink:0}
.detail-name{font-size:21px;font-weight:700}
.detail-pos{font-size:13px;color:var(--text2);margin-top:2px}
.detail-actions{margin-left:auto;display:flex;gap:8px}

.total-block{padding:16px;background:var(--green-light);border-bottom:1px solid #c6ede1}
.total-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.total-big{font-size:32px;font-weight:800;color:var(--green-dark)}
.total-sub{font-size:14px;color:var(--green)}
.total-pct{font-size:16px;font-weight:700;margin-left:auto}

.stats4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid var(--gray-border)}
.sbox{padding:12px 8px;text-align:center;border-right:1px solid var(--gray-border)}
.sbox:last-child{border-right:none}
.sbox-val{font-size:18px;font-weight:700}
.sbox-lbl{font-size:11px;color:var(--text2);margin-top:2px}

.section-hd{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.section-hd h3{font-size:15px;font-weight:600}

.week-block{padding:12px 16px;border-bottom:1px solid var(--gray-border)}
.week-block:last-child{border-bottom:none}
.week-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-lbl{font-size:14px;font-weight:600}
.week-inp-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.inp-g{display:flex;flex-direction:column;gap:3px;align-items:center}
.inp-g label{font-size:10px;color:var(--text3);font-weight:500;text-align:center}
.inp-g input{width:100%;padding:8px 4px;border:1.5px solid var(--gray-border);border-radius:8px;font-size:16px;text-align:center;background:var(--card);color:var(--text);outline:none}
.inp-g input:focus{border-color:var(--green)}
.inp-g input.run{border-color:#86efac}

.game-item{padding:12px 16px;border-bottom:1px solid var(--gray-border);display:flex;align-items:center;gap:10px}
.game-item:last-child{border-bottom:none}
.game-rating{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.game-info{flex:1}
.game-date{font-size:14px;font-weight:500}
.game-note{font-size:12px;color:var(--text2);margin-top:1px}
.del-btn{background:none;border:none;color:var(--text3);font-size:20px;padding:4px;line-height:1}
.del-btn:active{color:var(--red)}

.add-row{padding:12px 16px}
.section-pad{padding:0 16px 12px}

/* ── FORMATION SCREEN ── */
.pitch{background:linear-gradient(180deg,#16a34a 0%,#15803d 100%);border-radius:var(--radius);position:relative;overflow:visible;margin:0 auto;touch-action:none}
.pitch-lines{position:absolute;inset:0;pointer-events:none}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;user-select:none;z-index:10;min-width:52px}
.slot:active{cursor:grabbing;z-index:30}
.slot-circle{width:38px;height:38px;border-radius:50%;border:2.5px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:transform .1s;flex-shrink:0}
.slot.filled .slot-circle{background:var(--green-dark);border-color:#fff}
.slot.empty .slot-circle{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5);border-style:dashed}
.slot.drag-over .slot-circle{transform:scale(1.2);border-color:#fbbf24;background:rgba(251,191,36,.3)}
.slot-name{font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;max-width:52px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.bench-section{margin-top:14px}
.bench-hd{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)}
.bench-slots{display:flex;gap:10px;flex-wrap:wrap}
.bench-slot{width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab}
.bench-slot:active{cursor:grabbing;opacity:.7}
.bench-circle{width:40px;height:40px;border-radius:50%;background:var(--green-light);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--green-dark)}
.bench-circle.empty{background:var(--gray-light);border-color:var(--gray-border);border-style:dashed}
.bench-name{font-size:10px;font-weight:600;color:var(--text2);text-align:center;max-width:52px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.available-hd{font-size:14px;font-weight:600;margin:14px 0 10px}
.avail-list{display:flex;gap:8px;flex-wrap:wrap}
.avail-chip{padding:7px 13px;background:var(--card);border-radius:20px;border:1.5px solid var(--gray-border);font-size:13px;font-weight:500;cursor:grab;display:flex;align-items:center;gap:6px}
.avail-chip:active{opacity:.7;cursor:grabbing}
.avail-chip.dragging{opacity:.4}

.form-sel{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.form-btn{padding:7px 13px;border:1.5px solid var(--gray-border);border-radius:20px;font-size:13px;font-weight:500;background:var(--card);color:var(--text)}
.form-btn.active{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}

/* rating radio */
.rating-group{display:flex;gap:10px}
.rating-opt{flex:1}
.rating-opt input{display:none}
.rating-opt label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border:1.5px solid var(--gray-border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2)}
.rating-opt input:checked+label{border-color:var(--green);background:var(--green-light);color:var(--green-dark)}
.rating-opt label .icon{font-size:22px}

.empty-state{text-align:center;padding:50px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px}

.section-divider{height:8px;background:var(--bg)}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     HOME SCREEN — Team Auswahl
══════════════════════════════════════════ -->
<div class="screen active" id="screen-home">
  <div class="topnav">
    <div style="flex:1">
      <h1 style="font-size:20px">⚽ Meine Mannschaften</h1>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openModal('modal-team')">+ Team</button>
  </div>
  <div class="content" style="padding-bottom:24px">
    <div class="team-list" id="team-list">
      <div class="empty-state"><div class="icon">🏟️</div>Noch kein Team.<br>Füge dein erstes hinzu!</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     TEAM SCREEN — Tabs: Spieler / Ranking / Aufstellung
══════════════════════════════════════════ -->
<div class="screen" id="screen-team">
  <div class="topnav">
    <button class="topnav-back" onclick="goHome()">← Teams</button>
    <div style="flex:1">
      <h1 id="team-title" style="font-size:17px">Team</h1>
      <div class="subtitle" id="team-meta-sub"></div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openAddPlayer()" id="add-player-btn">+ Spieler</button>
  </div>

  <!-- Tab bar -->
  <div class="tabbar" id="main-tabbar">
    <button class="tabbar-btn active" id="tab-players" onclick="switchTab('players')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Spieler
    </button>
    <button class="tabbar-btn" id="tab-ranking" onclick="switchTab('ranking')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Ranking
    </button>
    <button class="tabbar-btn" id="tab-formation" onclick="switchTab('formation')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
      Aufstellung
    </button>
  </div>

  <!-- TAB: Spieler -->
  <div class="content" id="tab-content-players">
    <div class="player-grid" id="player-grid"></div>
  </div>

  <!-- TAB: Ranking -->
  <div class="content" id="tab-content-ranking" style="display:none">
    <div class="rank-list" id="rank-list"></div>
  </div>

  <!-- TAB: Aufstellung -->
  <div class="content" id="tab-content-formation" style="display:none">
    <div style="margin-bottom:12px">
      <div style="font-size:13px;color:var(--text2);margin-bottom:6px">Format</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="form-btn" id="fmt-8" onclick="setFormat(8)">8er (U13)</button>
        <button class="form-btn" id="fmt-11" onclick="setFormat(11)">11er</button>
      </div>
      <div class="form-sel" id="formation-btns"></div>
    </div>
    <div style="position:relative">
      <div class="pitch" id="pitch"></div>
    </div>
    <div class="bench-section">
      <div class="bench-hd">Bank (max. 6)</div>
      <div class="bench-slots" id="bench-slots"></div>
    </div>
    <div>
      <div class="available-hd">Nicht im Kader</div>
      <div class="avail-list" id="avail-list"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     DETAIL SCREEN — Spieler Details
══════════════════════════════════════════ -->
<div class="screen" id="screen-detail">
  <div id="detail-content"></div>
</div>


<!-- ═══ MODALS ═══ -->

<!-- New Team -->
<div class="overlay" id="modal-team">
  <div class="modal">
    <div class="modal-drag"></div>
    <h2>Neues Team</h2>
    <div class="field"><label>Teamname</label><input type="text" id="inp-team-name" placeholder="z.B. U13 Blau"></div>
    <div class="field">
      <label>Format</label>
      <select id="inp-team-format">
        <option value="8">8er (U8–U13)</option>
        <option value="11">11er (U14+)</option>
      </select>
    </div>
    <div class="modal-row">
      <button class="btn" onclick="closeModal('modal-team')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveTeam()">Erstellen</button>
    </div>
  </div>
</div>

<!-- New/Edit Player -->
<div class="overlay" id="modal-player">
  <div class="modal">
    <div class="modal-drag"></div>
    <h2 id="modal-player-title">Neuer Spieler</h2>
    <div class="field"><label>Name</label><input type="text" id="inp-pname" placeholder="z.B. Lukas Müller"></div>
    <div class="field">
      <label>Position(en)</label>
      <div class="pos-group" id="pos-group"></div>
    </div>
    <div class="modal-row">
      <button class="btn" onclick="closeModal('modal-player')">Abbrechen</button>
      <button class="btn btn-primary" onclick="savePlayer()">Speichern</button>
    </div>
  </div>
</div>

<!-- Add Game -->
<div class="overlay" id="modal-game">
  <div class="modal">
    <div class="modal-drag"></div>
    <h2>Spiel eintragen</h2>
    <div class="field"><label>Datum</label><input type="text" id="inp-gdate" placeholder="14.06.2025"></div>
    <div class="field"><label>Gegner / Notiz</label><input type="text" id="inp-gnote" placeholder="z.B. vs. FC Linz (optional)"></div>
    <div class="field">
      <label>Bewertung</label>
      <div class="rating-group">
        <div class="rating-opt"><input type="radio" name="grating" id="gr1" value="1"><label for="gr1"><span class="icon">😔</span>Schwach<br>(1 Pkt)</label></div>
        <div class="rating-opt"><input type="radio" name="grating" id="gr2" value="2" checked><label for="gr2"><span class="icon">😐</span>OK<br>(2 Pkt)</label></div>
        <div class="rating-opt"><input type="radio" name="grating" id="gr3" value="3"><label for="gr3"><span class="icon">⭐</span>Stark<br>(3 Pkt)</label></div>
      </div>
    </div>
    <div class="modal-row">
      <button class="btn" onclick="closeModal('modal-game')">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveGame()">Eintragen</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let db = JSON.parse(localStorage.getItem('trainerapp_v3') || '{"teams":[]}');
let curTeamId = null;
let curPlayerId = null;
let editPlayerId = null;
let gameTargetId = null;
let selPos = [];

// Formation state
let curFormat = 8;
let curFormation = '3-3-2';
let formation = {}; // slotKey -> playerId or null
let bench = []; // array of playerIds (max 6)

const POS_8 = ['Torwart','Verteidigung','Mittelfeld','Offensiv'];
const POS_11 = ['Torwart','Verteidigung','Mittelfeld','Offensiv'];

const FORMATIONS_8 = {
  '3-3-2': {label:'3-3-2', rows:[3,3,2]},
  '3-4-1': {label:'3-4-1', rows:[3,4,1]},
  '2-4-2': {label:'2-4-2', rows:[2,4,2]},
};
const FORMATIONS_11 = {
  '4-4-2':  {label:'4-4-2',  rows:[4,4,2]},
  '4-2-3-1':{label:'4-2-3-1',rows:[4,2,3,1]},

// ═══════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function initials(name) { return name.trim().split(' ').map(n=>n[0]||'').join('').toUpperCase().slice(0,2)||'?'; }
function today() { return new Date().toLocaleDateString('de-AT'); }

function getTeam(id) { return db.teams.find(t=>t.id===id); }
function getPlayer(tid, pid) { return getTeam(tid)?.players?.find(p=>p.id===pid); }

function calcTotal(p) {
  let pts = 0;
  (p.weeks||[]).forEach(w=>{
    pts += Math.min(parseInt(w.t1)||0,5);
    pts += Math.min(parseInt(w.t2)||0,5);
    pts += Math.min(parseInt(w.t3)||0,5);
    pts += Math.min(parseInt(w.run)||0,10);
  });
  (p.games||[]).forEach(g=>{ pts += Math.min(parseInt(g.rating)||1,3); });
  return pts;
}
function calcMax(p) {
  return (p.weeks||[]).length * 25 + (p.games||[]).length * 3;
}
function pctColor(pct) {
  if(pct>=75) return 'green';
  if(pct>=50) return 'orange';
  return 'red';
}
function barHex(col) {
  return col==='green'?'#16a07a':col==='orange'?'#f59e0b':'#ef4444';
}
function ratingIcon(r) {
  return r==1?'😔':r==2?'😐':'⭐';
}

// PLAYERS TAB

function renderPlayers() {
  const t = getTeam(curTeamId);
  const grid = document.getElementById('player-grid');
  if(!t||!t.players.length){
    grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div class="icon">👦</div>Noch keine Spieler.<br>Füge deinen ersten hinzu!</div>';
    return;
  }
  grid.innerHTML = t.players.map(p=>{
    const total = calcTotal(p), max = calcMax(p);
    const pct = max>0?Math.round(total/max*100):0;
    const col = max>0?pctColor(pct):'';
    const hex = col?barHex(col):'#ccc';
    return `<div class="pcard ${col}" onclick="openDetail('${p.id}')">
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-pos">${(p.positions||[]).join(' · ')||'–'}</div>
      <div class="pcard-pts"><span class="big" style="color:${hex}">${total}</span><span class="mx">${max>0?'/ '+max+' P':'Pkt'}</span></div>
      ${max>0?`<div style="display:flex;align-items:center;gap:8px;margin:6px 0 4px"><span class="badge badge-${col}">${pct}%</span></div><div class="bar-wrap" style="height:6px"><div class="bar-fill" style="width:${pct}%;background:${hex}"></div></div>`:''}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
// RANKING TAB
// ═══════════════════════════════════════════
function renderRanking() {
  const t = getTeam(curTeamId);
  const el = document.getElementById('rank-list');
  if(!t||!t.players.length){
    el.innerHTML='<div class="empty-state"><div class="icon">🏆</div>Noch keine Spieler</div>';
    return;
  }
  const sorted = [...t.players].map(p=>({p, total:calcTotal(p), max:calcMax(p)}))
    .sort((a,b)=>b.total-a.total||(b.max-a.max));
  el.innerHTML = sorted.map(({p,total,max},i)=>{
    const pct = max>0?Math.round(total/max*100):0;
    const col = max>0?pctColor(pct):'gray';
    const hex = barHex(col);
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    return `<div class="card"><div class="rank-item" onclick="openDetail('${p.id}')">
      <div class="rank-num ${i<3?'top':''}">${medal||'#'+(i+1)}</div>
      <div class="rank-avatar">${initials(p.name)}</div>
      <div style="flex:1;min-width:0">
        <div class="rank-name">${p.name}</div>
        <div class="rank-pos">${(p.positions||[]).join(' · ')||'–'}</div>
        ${max>0?`<div class="bar-wrap" style="height:5px;margin-top:6px"><div class="bar-fill" style="width:${pct}%;background:${hex}"></div></div>`:''}
      </div>
      <div class="rank-right">
        <div class="rank-pts" style="color:${hex}">${total}</div>
        <div class="rank-pct">${max>0?pct+'%':'–'}</div>
      </div>
    </div></div>`;
  }).join('');
}

// DATA MUTATIONS
// ═══════════════════════════════════════════
function updWeek(pid, idx, field, val) {
  const p = getPlayer(curTeamId, pid);
  if(!p||!p.weeks[idx])return;
  p.weeks[idx][field] = Math.max(0,parseInt(val)||0);
  save(); renderDetail();
}
function addWeek(pid) {
  const p = getPlayer(curTeamId, pid);
  p.weeks.push({label:p.weeks.length+1,t1:0,t2:0,t3:0,run:0});
  save(); renderDetail();
}
function removeWeek(pid,idx) {
  const p = getPlayer(curTeamId, pid);
  p.weeks.splice(idx,1);
  p.weeks.forEach((w,i)=>w.label=i+1);
  save(); renderDetail();
}
function openGameModal(pid) {
  gameTargetId=pid;
  document.getElementById('inp-gdate').value=today();
  document.getElementById('inp-gnote').value='';
  document.getElementById('gr2').checked=true;
  openModal('modal-game');
}
function saveGame() {
  const p = getPlayer(curTeamId, gameTargetId);
  const rating = parseInt(document.querySelector('input[name="grating"]:checked')?.value||2);
  p.games.push({date:document.getElementById('inp-gdate').value.trim()||today(), note:document.getElementById('inp-gnote').value.trim(), rating});
  save(); closeModal('modal-game'); renderDetail();
}
function removeGame(pid,idx) {
  const p = getPlayer(curTeamId,pid);
  if(!confirm('Spiel entfernen?'))return;
  p.games.splice(idx,1); save(); renderDetail();
}
function deletePlayer(pid) {
  if(!confirm('Spieler wirklich löschen?'))return;
  const t=getTeam(curTeamId);
  t.players=t.players.filter(p=>p.id!==pid);
  save(); backToTeam(); renderPlayers();
}

// ═══════════════════════════════════════════
// FORMATION
// ═══════════════════════════════════════════
function setFormat(f) {
  curFormat=f;
  document.getElementById('fmt-8').classList.toggle('active',f===8);
  document.getElementById('fmt-11').classList.toggle('active',f===11);
  const fmts = f===8?FORMATIONS_8:FORMATIONS_11;
  curFormation = Object.keys(fmts)[0];
  formation={}; bench=[];
  renderFormation();
}

function setFormation(key) {
  curFormation=key; formation={}; 
  renderFormation();
}

function getSlots() {
  const fmts = curFormat===8?FORMATIONS_8:FORMATIONS_11;
  const f = fmts[curFormation];
  if(!f) return [];
  const slots=[];
  // GK always first
  slots.push({key:'gk',row:-1,col:0,label:'TW'});
  f.rows.forEach((count,ri)=>{
    for(let ci=0;ci<count;ci++){
      slots.push({key:`r${ri}c${ci}`,row:ri,col:ci,count,label:''});
    }
  });
  return slots;
}

function renderFormation() {
  const fmts = curFormat===8?FORMATIONS_8:FORMATIONS_11;
  // Formation buttons
  const fbEl = document.getElementById('formation-btns');
  fbEl.innerHTML = Object.keys(fmts).map(k=>
    `<button class="form-btn ${k===curFormation?'active':''}" onclick="setFormation('${k}')">${fmts[k].label}</button>`
  ).join('');

  document.getElementById('fmt-8').classList.toggle('active',curFormat===8);
  document.getElementById('fmt-11').classList.toggle('active',curFormat===11);

  const t = getTeam(curTeamId);
  const players = t?.players||[];

  // Pitch
  const pitch = document.getElementById('pitch');
  const isMobile = window.innerWidth < 500;
  const PW = Math.min(window.innerWidth - 32, 480);
  const PH = Math.round(PW * 1.45);
  pitch.style.width = PW+'px';
  pitch.style.height = PH+'px';

  const rows = fmts[curFormation]?.rows||[];
  const totalRows = rows.length; // field rows (not counting GK)

  // Build slot positions
  const slotDefs = [];
  // GK at bottom
  slotDefs.push({key:'gk', x:0.5, y:0.92, label:'TW'});
  // Field rows from bottom upwards
  rows.forEach((count,ri)=>{
    const y = 0.78 - (ri/(totalRows))*0.68;
    for(let ci=0;ci<count;ci++){
      const x = (ci+1)/(count+1);
      slotDefs.push({key:`r${ri}c${ci}`, x, y, label:''});
    }
  });

  pitch.innerHTML = `
    <svg class="pitch-lines" viewBox="0 0 ${PW} ${PH}" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="${PW-4}" height="${PH-4}" rx="6" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
      <line x1="${PW/2-60}" y1="${PH-2}" x2="${PW/2+60}" y2="${PH-2}" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
      <line x1="${PW/2-60}" y1="2" x2="${PW/2+60}" y2="2" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/>
      <line x1="0" y1="${PH/2}" x2="${PW}" y2="${PH/2}" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      <circle cx="${PW/2}" cy="${PH/2}" r="${PW*0.12}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
      <rect x="${PW*0.2}" y="${PH-PH*0.15}" width="${PW*0.6}" height="${PH*0.14}" rx="2" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
      <rect x="${PW*0.2}" y="${PH*0.02}" width="${PW*0.6}" height="${PH*0.14}" rx="2" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
    </svg>
  ` + slotDefs.map(s=>{
    const pid = formation[s.key]||null;
    const player = pid ? players.find(p=>p.id===pid) : null;
    const filled = !!player;
    return `<div class="slot ${filled?'filled':'empty'}" 
      id="slot-${s.key}"
      data-key="${s.key}"
      style="left:${Math.round(s.x*PW)}px;top:${Math.round(s.y*PH)}px"
      draggable="${filled?'true':'false'}"
      ondragstart="onSlotDragStart(event,'${s.key}')"
      ondragover="event.preventDefault();this.classList.add('drag-over')"
      ondragleave="this.classList.remove('drag-over')"
      ondrop="onSlotDrop(event,'${s.key}')"
      ontouchstart="touchStart(event,'slot','${s.key}')"
      ontouchmove="touchMove(event)"
      ontouchend="touchEnd(event,'slot','${s.key}')">
      <div class="slot-circle">${filled?initials(player.name):'+'}</div>
      <div class="slot-name">${filled?player.name.split(' ')[0]:(s.key==='gk'?'TW':'')}</div>
    </div>`;
  }).join('');

  // Bench
  const benchEl = document.getElementById('bench-slots');
  const benchSlots = [];
  for(let i=0;i<6;i++){
    const pid = bench[i]||null;
    const player = pid ? players.find(p=>p.id===pid) : null;
    benchSlots.push(`<div class="bench-slot" 
      data-bench="${i}"
      draggable="${!!player?'true':'false'}"
      ondragstart="onBenchDragStart(event,${i})"
      ondragover="event.preventDefault()"
      ondrop="onBenchDrop(event,${i})"
      ontouchstart="touchStart(event,'bench',${i})"
      ontouchmove="touchMove(event)"
      ontouchend="touchEnd(event,'bench',${i})">
      <div class="bench-circle ${player?'':'empty'}">${player?initials(player.name):''}</div>
      <div class="bench-name">${player?player.name.split(' ')[0]:'–'}</div>
    </div>`);
  }
  benchEl.innerHTML = benchSlots.join('');

  // Available players
  const usedIds = new Set([...Object.values(formation).filter(Boolean), ...bench.filter(Boolean)]);
  const available = players.filter(p=>!usedIds.has(p.id));
  const availEl = document.getElementById('avail-list');
  if(!available.length){
    availEl.innerHTML='<span style="font-size:13px;color:var(--text2)">Alle Spieler eingeteilt</span>';
  } else {
    availEl.innerHTML = available.map(p=>
      `<div class="avail-chip" id="avail-${p.id}" draggable="true"
        ondragstart="onAvailDragStart(event,'${p.id}')"
        ontouchstart="touchStart(event,'avail','${p.id}')"
        ontouchmove="touchMove(event)"
        ontouchend="touchEnd(event,'avail','${p.id}')">
        <div style="width:22px;height:22px;border-radius:50%;background:var(--green-light);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${initials(p.name)}</div>
        ${p.name}
      </div>`
    ).join('');
  }
}

// ── DRAG: Desktop ──
function onAvailDragStart(e, pid) { dragType='avail'; dragPlayerId=pid; dragFromKey=null; e.dataTransfer.effectAllowed='move'; }
function onSlotDragStart(e, key) { const pid=formation[key]; if(!pid)return; dragType='slot'; dragPlayerId=pid; dragFromKey=key; e.dataTransfer.effectAllowed='move'; }
function onBenchDragStart(e, i) { const pid=bench[i]; if(!pid)return; dragType='bench'; dragPlayerId=pid; dragFromKey=i; e.dataTransfer.effectAllowed='move'; }

function onSlotDrop(e, toKey) {
  e.preventDefault();
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('drag-over'));
  if(!dragPlayerId) return;
  const existing = formation[toKey]||null;
  if(dragType==='slot' && dragFromKey) {
    formation[dragFromKey] = existing;
  } else if(dragType==='bench') {
    bench[dragFromKey] = existing || null;
  } else if(dragType==='avail' && existing) {
    // existing goes back to avail — handled by re-render
  }
  formation[toKey] = dragPlayerId;
  dragPlayerId=null; dragType=null; dragFromKey=null;
  renderFormation();
}

function onBenchDrop(e, toIdx) {
  e.preventDefault();
  if(!dragPlayerId) return;
  const existing = bench[toIdx]||null;
  if(dragType==='slot' && dragFromKey) {
    formation[dragFromKey] = existing||null;
  } else if(dragType==='bench' && dragFromKey!==toIdx) {
    bench[dragFromKey] = existing||null;
  }
  bench[toIdx] = dragPlayerId;
  dragPlayerId=null; dragType=null; dragFromKey=null;
  renderFormation();
}

// ── DRAG: Touch ──
let touchGhost = null;
let touchDragType = null, touchDragPid = null, touchDragFrom = null;
let touchStartX=0, touchStartY=0;

function touchStart(e, type, key) {
  const t = e.touches[0];
  touchStartX=t.clientX; touchStartY=t.clientY;
  touchDragType=type; touchDragFrom=key;
  const el = e.currentTarget;
  // figure out pid
  if(type==='avail') touchDragPid=key;
  else if(type==='slot') touchDragPid=formation[key]||null;
  else if(type==='bench') touchDragPid=bench[key]||null;
  if(!touchDragPid) return;
  // create ghost
  touchGhost = el.cloneNode(true);
  touchGhost.style.cssText=`position:fixed;z-index:999;pointer-events:none;opacity:.8;transform:scale(1.1);left:${t.clientX-26}px;top:${t.clientY-26}px;`;
  document.body.appendChild(touchGhost);
  e.preventDefault();
}

function touchMove(e) {
  if(!touchGhost||!touchDragPid) return;
  const t=e.touches[0];
  touchGhost.style.left=(t.clientX-26)+'px';
  touchGhost.style.top=(t.clientY-26)+'px';
  e.preventDefault();
}

function touchEnd(e) {
  if(touchGhost){touchGhost.remove();touchGhost=null;}
  if(!touchDragPid) return;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if(!el){touchDragPid=null;return;}
  const slotEl = el.closest('.slot');
  const benchEl = el.closest('.bench-slot');
  if(slotEl) {
    const toKey = slotEl.dataset.key;
    const existing = formation[toKey]||null;
    if(touchDragType==='slot' && touchDragFrom) formation[touchDragFrom]=existing;
    else if(touchDragType==='bench') bench[touchDragFrom]=existing||null;
    formation[toKey]=touchDragPid;
  } else if(benchEl) {
    const toIdx = parseInt(benchEl.dataset.bench);
    const existing = bench[toIdx]||null;
    if(touchDragType==='slot' && touchDragFrom) formation[touchDragFrom]=existing||null;
    else if(touchDragType==='bench' && touchDragFrom!==toIdx) bench[touchDragFrom]=existing||null;
    bench[toIdx]=touchDragPid;
  }
  touchDragPid=null; touchDragType=null; touchDragFrom=null;
  renderFormation();
}

// ═══════════════════════════════════════════
// MODAL HELPERS
// ═══════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(el=>el.classList.remove('open'));});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderHome();
</script>
